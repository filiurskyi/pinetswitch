# /etc/pinetswitch.toml: every key is optional, defaults are in Config (pinetswitch.py)

home_profile = "Loading"
home_router_mac = "94:83:c4:e3:d1:4a"   # gateway MAC on a wired uplink = we are home
# wired = ["*"]          # wired uplinks: NM ethernet devices matching these globs (not usb0 or the iPhone tether)
phone_profile = "iPhone 12 Pro Max"
ap_profile = "Loading Berry"

home_search_secs = 5      # look only for home this long
total_search_secs = 15    # then also the phone; start the AP after this
ap_rescan_every = 180     # drop the AP to look for home/phone (skipped while clients are connected)
ap_rescan_secs = 10

vpn_profile = "Home VPN"
vpn_iface = "rpi5"
vpn_endpoint_port = 64894
vpn_listen_port = 51820   # fixed local WireGuard port (set on the NM profile too)
vpn_enforce = true        # kill switch: no internet outside the tunnel unless home

usb_subnet = "10.42.0.0/24"   # own networks whose clients may be routed (Docker drops forwarding)
ap_subnet = "10.43.0.0/24"

[power.full]
max_freq = 2400000
governor = "ondemand"

[power.low]
max_freq = 1500000
governor = "ondemand"
